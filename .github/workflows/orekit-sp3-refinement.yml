name: Orekit SP3 epoch validation research (pinned)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/orekit-sp3-refinement.yml"
      - "research/sp3/**"

permissions:
  contents: read

jobs:
  sp3-research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout research files
        uses: actions/checkout@v4
      - name: Checkout pinned Orekit
        uses: actions/checkout@v4
        with:
          repository: CS-SI/Orekit
          ref: 90d9b4bdda78891e451d881afa3c11ac9645ac42
          path: upstream
          persist-credentials: false
      - name: Checkout pinned Hipparchus
        uses: actions/checkout@v4
        with:
          repository: Hipparchus-Math/hipparchus
          ref: a32301f096e97f098dedbdb3fab41d8343128595
          path: hipparchus
          persist-credentials: false
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            upstream/pom.xml
            hipparchus/pom.xml
      - name: Install pinned Hipparchus snapshot
        working-directory: hipparchus
        run: mvn -B -ntp -DskipTests -Dgpg.skip=true install
      - name: Apply research patch and regression fixtures
        run: |
          git -C upstream rev-parse HEAD | grep -Fx '90d9b4bdda78891e451d881afa3c11ac9645ac42'
          git -C upstream apply --check "$GITHUB_WORKSPACE/research/sp3/patches/sp3-epoch-collision.patch"
          git -C upstream apply "$GITHUB_WORKSPACE/research/sp3/patches/sp3-epoch-collision.patch"
          cp research/sp3/tests/SP3EpochMergeResearchTest.java upstream/src/test/java/org/orekit/files/sp3/
          cp research/sp3/tests/SP3ValidationPerformanceResearchTest.java upstream/src/test/java/org/orekit/files/sp3/
      - name: SP3 parser writer and research regression tests
        working-directory: upstream
        run: mvn -B -ntp '-Dtest=SP3*Test,OrekitMessagesTest' -DfailIfNoTests=true test
      - name: Archive Surefire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp3-refinement-surefire
          path: upstream/target/surefire-reports/
          if-no-files-found: warn
